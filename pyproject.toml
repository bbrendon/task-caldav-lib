[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-caldav-lib"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "caldav>=3.3",
    "icalendar>=7.0",
    "python-dateutil",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "radicale>=3.5"]

[tool.setuptools]
packages = ["task_caldav_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
